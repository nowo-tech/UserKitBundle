# Default configuration for User Kit Bundle.
# Copy to your app: config/packages/nowo_user_kit.yaml (or use the Symfony Flex recipe).
# See docs/CONFIGURATION.md for all options.
#
nowo_user_kit:
    # Profile used when no profile name is passed to user_is_online() or UserPresenceResolver.
    default_profile: default

    # Register the user_is_online and user_ui_html_attributes Twig helpers when Twig is installed.
    twig: true

    # GDPR self-service SPI (PersonalDataExporter / PersonalDataEraser). Opt-in.
    personal_data:
        enabled: false
        # "schema" and "version" keys of the export document.
        schema: 'nowo-user-kit/personal-data'
        version: 1
        # Built-in sections: account_status, last_activity, ui_preferences, product_tour.
        builtin_providers: true
        # Built-in erasers: last_activity, ui_preferences, product_tour.
        builtin_erasers: true

    # Session registry: list / revoke sessions, concurrent-session limit. Opt-in (needs the user_kit_session table).
    sessions:
        enabled: false
        # Seconds after which an idle session is expired (keep it >= framework.session.gc_maxlifetime).
        idle_lifetime: 86400
        # Write last_seen_at at most once per this many seconds per session.
        touch_interval: 300
        revocation:
            # database (one query per signed-in request, works everywhere) | cache (shared pool, no query).
            store: database
            # Required with store: cache — a pool shared by every web server (per-server pools are refused).
            # cache_pool: cache.sessions_redis
        client:
            # label: browser / OS names only | none
            user_agent: label
            # truncate (network /24, /48) | hash | none
            ip: truncate
        limit:
            # null = unlimited
            max_sessions: null
            # evict_oldest | reject_new
            policy: evict_oldest
        password_change:
            # Sign out the other sessions when the password changes.
            revoke_sessions: true
        doctrine:
            table_prefix: ''
        web_ui:
            # "My sessions" + administration pages (import the nowo_user_kit_sessions route loader).
            enabled: false
            path_prefix: /account/sessions
            admin_path_prefix: /admin/user-sessions
        security:
            access_roles: [ROLE_USER]
            manage_roles: [ROLE_ADMIN]

    profiles:
        default:
            # FQCN of the application user entity (required unless nowo_auth_kit.user_class is set).
            user_class: App\Entity\User

            account_status:
                # Register AccountStatusUserChecker for this profile when enabled is false.
                enabled: true
                # Entity property or accessor for the enabled flag.
                field: enabled
                # Invalidate active sessions when enabled changes from true to false.
                invalidate_sessions_on_disable: false

            last_activity:
                # Persist lastActivityAt on authenticated requests for this profile.
                enabled: false
                # Entity property for the last activity timestamp.
                field: lastActivityAt
                # Seconds within which a user is considered "online" (minimum: 1).
                online_threshold: 300
                # Minimum seconds between DB writes for last activity (minimum: 0).
                update_throttle: 30

        # Example second profile (uncomment and adjust user_class as needed):
        # admin:
        #     user_class: App\Entity\Admin
        #     account_status:
        #         enabled: true
        #         field: isActive
        #     last_activity:
        #         enabled: true
        #         field: lastSeenAt
        #         online_threshold: 60
        #         update_throttle: 15
