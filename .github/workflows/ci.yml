name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Superseded PR runs are cancelled. Push runs (main/master) get their own group (run_id), so a main run is never
# cancelled, not even while pending: tag_when_green.sh needs a completed run on every release commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Light mode (docs/GITHUB_CI.md#light-mode-for-deps-and-docs-only-prs): one representative cell plus the cheap
  # gates. The org (or repo) Actions variable NOWO_CI_PR_MODE picks the PR mode: light = every PR light; full = every
  # PR full; auto / unset = light only when the PR touches nothing but composer.json / composer.lock (root or demo),
  # docs/**, *.md, .github/ISSUE_TEMPLATE/**, specs/** or .cursor/**. push, tags, workflow_dispatch and schedule are
  # always full. Fail-closed: any error, unknown value or empty output means full (jobs reduce only on 'light').
  changes:
    name: Change scope (light or full)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout code (PR merge commit and its base parent)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          SWITCH: ${{ vars.NOWO_CI_PR_MODE }}
          LIGHT: '^((demo/([^/]+/)?)?composer\.(json|lock)|docs/.*|specs/.*|\.cursor/.*|\.github/ISSUE_TEMPLATE/.*|.*\.md)$'
        run: |
          mode=full; paths=""
          if [ "$EVENT" != pull_request ]; then
            reason="event '$EVENT' always runs full"
          else
            case "$SWITCH" in
              light) mode=light; reason="NOWO_CI_PR_MODE=light: every PR is light" ;;
              full) reason="NOWO_CI_PR_MODE=full: every PR is full" ;;
              ''|auto)
                if files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
                  mode=light; reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): only deps/docs paths changed"
                  while IFS= read -r f; do
                    [ -n "$f" ] || continue
                    if ! printf '%s\n' "$f" | grep -Eq "$LIGHT"; then mode=full; paths="$paths $f"; fi
                  done <<< "$files"
                  [ "$mode" = light ] || reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): non deps/docs paths changed:$paths"
                else
                  reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): git diff failed, fail-closed"
                fi ;;
              *) reason="NOWO_CI_PR_MODE='$SWITCH' is not light/auto/full, fail-closed" ;;
            esac
          fi
          echo "mode=$mode ($reason)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### CI mode: \`$mode\`"
            echo ""
            echo "$reason"
            if [ "$EVENT" = pull_request ] && [ -n "${files:-}" ]; then echo ""; echo "Changed paths:"; echo '```'; echo "$files" | head -200; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: changes
    # Never skipped at job level (a skipped matrix job leaves its required contexts "Expected"): the cells that are not
    # representative in light mode pass after one echo step.
    if: ${{ !cancelled() }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.2', '8.3', '8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        symfony: ['7.4', '8.1']
        exclude:
          # Symfony 8.0 and 8.1 require PHP 8.4+
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' || (matrix.php == '8.5' && matrix.symfony == '8.1') }}
    steps:
      - name: Light mode (deps/docs-only PR) - covered by PHP 8.5 - Symfony 8.1
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, gd, sodium
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        if: env.HEAVY == 'true'
        run: composer validate --strict

      - name: Get Composer cache directory
        if: env.HEAVY == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        if: env.HEAVY == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        if: env.HEAVY == 'true'
        run: composer config platform.php "${{ matrix.php }}.99"

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        if: env.HEAVY == 'true'
        run: |
          echo "📦 Installing dependencies for Symfony ${{ matrix.symfony }}..."
          # doctrine/doctrine-bundle 3.x requires PHP ^8.4; use 2.x on PHP 8.2/8.3
          if [[ "${{ matrix.php }}" == "8.4" || "${{ matrix.php }}" == "8.5" ]]; then
            DOCTRINE_BUNDLE="^3.4" # 3.4+ deprecates the mapping alias option: the 8.1 cells must run it
          else
            DOCTRINE_BUNDLE="^2.10"
          fi
          composer require \
            symfony/framework-bundle:^${{ matrix.symfony }} \
            symfony/security-bundle:^${{ matrix.symfony }} \
            symfony/security-core:^${{ matrix.symfony }} \
            symfony/property-access:^${{ matrix.symfony }} \
            symfony/config:^${{ matrix.symfony }} \
            symfony/dependency-injection:^${{ matrix.symfony }} \
            symfony/http-kernel:^${{ matrix.symfony }} \
            symfony/twig-bundle:^${{ matrix.symfony }} \
            symfony/yaml:^${{ matrix.symfony }} \
            doctrine/orm:^3.0 \
            doctrine/doctrine-bundle:${DOCTRINE_BUNDLE} \
            --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Composer audit (Critical/High)
        if: env.HEAVY == 'true'
        run: composer audit --locked


      - name: Run tests
        if: env.HEAVY == 'true'
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          echo "🧪 Running tests on PHP ${{ matrix.php }} with Symfony ${{ matrix.symfony }}..."
          composer test
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Validate coverage (PHP 8.2 with Symfony 7.4 only)
        if: env.HEAVY == 'true' && matrix.php == '8.2' && matrix.symfony == '7.4'
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          echo "📊 Generating coverage report..."
          composer test-coverage

          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed when generating coverage report"
            exit 1
          fi

          echo "✅ All tests passed, validating 100% coverage..."

          # Validate that coverage is 100%
          php -r "
          if (!file_exists('coverage.xml')) {
              echo 'ERROR: coverage.xml file was not generated\n';
              exit(1);
          }

          \$coverage = simplexml_load_file('coverage.xml');
          if (\$coverage === false) {
              echo 'ERROR: Could not read coverage.xml\n';
              exit(1);
          }

          \$metrics = \$coverage->project->metrics;
          \$elements = (float)\$metrics['elements'];
          \$coveredElements = (float)\$metrics['coveredelements'];

          if (\$elements == 0) {
              echo 'No elements to cover\n';
              exit(0);
          }

          \$percentage = (\$coveredElements / \$elements) * 100;

          echo \"Coverage: \$coveredElements/\$elements (\$percentage%)\n\";

          if (\$percentage < 100) {
              echo \"ERROR: Coverage must be 100%. Current: \$percentage%\n\";
              exit(1);
          }

          echo \"✅ 100% coverage confirmed\n\";
          "

  doctrine-lowest:
    name: Doctrine DBAL 4.3 + ORM 3.6 (schema listener without Schema::edit / setClassTable)
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, gd, sodium
          tools: composer:v2
      - name: Install DBAL 4.3 and ORM 3.6
        run: |
          # Owner images' StorageKit (dev only) needs ORM 3.7+: this job runs the session listener tests only.
          composer remove --dev nowo-tech/storage-kit-bundle league/flysystem-memory --no-interaction --no-update
          composer require doctrine/dbal:4.3.* doctrine/orm:3.6.* doctrine/doctrine-bundle:^2.10 --no-interaction --no-update --with-all-dependencies
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
          composer show | grep -E '^doctrine/(dbal|orm) '
      - name: Owner collation listener
        run: vendor/bin/phpunit tests/Unit/Sessions/Doctrine/OwnerCollationListenerTest.php

  real-databases:
    name: Session transactions on PostgreSQL, MySQL and MariaDB
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_DB: user_kit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-placeholder
          MYSQL_DATABASE: user_kit
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-placeholder" --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-placeholder
          MARIADB_DATABASE: user_kit
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, gd, sodium, pdo_pgsql, pdo_mysql
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction --no-progress
      - name: PostgreSQL
        env:
          USER_KIT_TEST_DB_URL: postgresql://postgres:ci-placeholder@127.0.0.1:5432/user_kit?serverVersion=17&charset=utf8
          USER_KIT_TEST_DB_PLATFORM: postgresql
        run: |
          vendor/bin/phpunit --no-coverage tests/Integration/Sessions/SessionAdoptTest.php tests/Integration/Sessions/SessionCommitBoundaryTest.php tests/Integration/Sessions/SessionCommitBoundaryRunnersTest.php tests/Integration/Sessions/SessionTouchFoundRowsTest.php tests/Integration/Sessions/SessionTouchSnapshotTest.php tests/Integration/Sessions/AccountErasedEventTest.php
          vendor/bin/phpunit --no-coverage tests/Integration/Sessions/SessionLookalikeOwnerTest.php tests/Integration/Sessions/SchemaForeignKeysDatabaseTest.php
          vendor/bin/phpunit --no-coverage tests/Integration/OwnerImage/PointerLookalikeTest.php
          vendor/bin/phpunit --no-coverage tests/Integration/OwnerImage/ColumnPointerStoreTest.php tests/Integration/OwnerImage/OwnerImageAuditBridgeTest.php
      - name: MySQL
        env:
          USER_KIT_TEST_DB_URL: mysql://root:ci-placeholder@127.0.0.1:3306/user_kit?serverVersion=8.4.0&charset=utf8mb4
          USER_KIT_TEST_DB_PLATFORM: mysql
        run: |
          vendor/bin/phpunit --no-coverage tests/Integration/Sessions/SessionAdoptTest.php tests/Integration/Sessions/SessionCommitBoundaryTest.php tests/Integration/Sessions/SessionCommitBoundaryRunnersTest.php tests/Integration/Sessions/SessionTouchFoundRowsTest.php tests/Integration/Sessions/SessionTouchSnapshotTest.php tests/Integration/Sessions/AccountErasedEventTest.php
          vendor/bin/phpunit --no-coverage tests/Integration/Sessions/SessionLookalikeOwnerTest.php tests/Integration/Sessions/SessionExactOwnerCollationTest.php tests/Integration/Sessions/SchemaForeignKeysDatabaseTest.php
          vendor/bin/phpunit --no-coverage tests/Integration/OwnerImage/PointerLookalikeTest.php
          vendor/bin/phpunit --no-coverage tests/Integration/OwnerImage/ColumnPointerStoreTest.php tests/Integration/OwnerImage/OwnerImageAuditBridgeTest.php
      - name: MariaDB
        env:
          USER_KIT_TEST_DB_URL: mysql://root:ci-placeholder@127.0.0.1:3307/user_kit?serverVersion=11.4.0-MariaDB&charset=utf8mb4
          USER_KIT_TEST_DB_PLATFORM: mysql
        # Look-alike owners only (house rule LQ): MariaDB's PAD SPACE default collation and utf8mb4_nopad_bin.
        run: |
          vendor/bin/phpunit --no-coverage tests/Integration/Sessions/SessionLookalikeOwnerTest.php tests/Integration/Sessions/SessionExactOwnerCollationTest.php tests/Integration/Sessions/SchemaForeignKeysDatabaseTest.php
          vendor/bin/phpunit --no-coverage tests/Integration/OwnerImage/PointerLookalikeTest.php
          vendor/bin/phpunit --no-coverage tests/Integration/OwnerImage/ColumnPointerStoreTest.php tests/Integration/OwnerImage/OwnerImageAuditBridgeTest.php

  load-readiness:
    # 1.19.0 (Beacon spec 239): the races of tests/Load on real servers, each test fails against 1.18.0. 1.21.0: MariaDB.
    name: Load readiness (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: changes
    # Never skipped at job level (required matrix contexts): in light mode every cell passes after one echo step.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'MySQL 8.4, DBAL 4', url: 'mysql://root@127.0.0.1:3306/user_kit_load?serverVersion=8.4.0&charset=utf8mb4', dbal: '' }
          - { name: 'PostgreSQL 16, DBAL 4', url: 'postgresql://postgres@127.0.0.1:5432/user_kit_load?serverVersion=16&charset=utf8', dbal: '' }
          - { name: 'MySQL 8.4, DBAL 3', url: 'mysql://root@127.0.0.1:3306/user_kit_load?serverVersion=8.4.0&charset=utf8mb4', dbal: '^3.8.2' }
          - { name: 'PostgreSQL 16, DBAL 3', url: 'postgresql://postgres@127.0.0.1:5432/user_kit_load?serverVersion=16&charset=utf8', dbal: '^3.8.2' }
          # 1.21.0 (REQ-RUNTIME-003): MariaDB 11.x next to MySQL 8.4 and PostgreSQL 16.
          - { name: 'MariaDB 11.4, DBAL 4', url: 'mysql://root@127.0.0.1:3307/user_kit_load?serverVersion=11.4.0-MariaDB&charset=utf8mb4', dbal: '' }
          - { name: 'MariaDB 11.4, DBAL 3', url: 'mysql://root@127.0.0.1:3307/user_kit_load?serverVersion=11.4.0-MariaDB&charset=utf8mb4', dbal: '^3.8.2' }
    services:
      mysql:
        image: ${{ needs.changes.outputs.mode != 'light' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: user_kit_load
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot --silent" --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: ${{ needs.changes.outputs.mode != 'light' && 'mariadb:11.4' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: user_kit_load
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: ${{ needs.changes.outputs.mode != 'light' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: user_kit_load
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}
    steps:
      - name: Light mode (deps/docs-only PR) - no database run
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - uses: actions/checkout@v7
        if: env.HEAVY == 'true'
      - uses: shivammathur/setup-php@v2
        if: env.HEAVY == 'true'
        with:
          php-version: '8.4'
          extensions: json, pdo_mysql, pdo_pgsql, gd, sodium
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        if: env.HEAVY == 'true'
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Use DBAL 3
        if: env.HEAVY == 'true' && matrix.dbal != ''
        run: |
          # A full update: StorageKit's instance-settings dependency must go back to a release that allows DBAL 3.
          composer require --no-update --no-interaction "doctrine/dbal:${{ matrix.dbal }}"
          composer update --with-all-dependencies --no-interaction --no-progress
          composer show doctrine/dbal | grep -E '^versions'
      - name: Races on a real server
        if: env.HEAVY == 'true'
        timeout-minutes: 10
        env:
          USER_KIT_LOAD_DATABASE_URL: ${{ matrix.url }}
        run: vendor/bin/phpunit --no-coverage --fail-on-skipped --testsuite load

  dbal-floor:
    name: Sessions on the DBAL 3 floor (SQLite)
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, gd, sodium
          tools: composer:v2
      - name: Resolve the lowest supported DBAL
        run: |
          composer require doctrine/dbal:~3.8.0 --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies
      - run: vendor/bin/phpunit --no-coverage tests/Integration/Sessions tests/Unit/Sessions

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    # Only apply fixes automatically on push to main/master, not on PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Fix code style
        run: composer cs-fix

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- '*.php')" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u -- '*.php'
          git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    # On PRs only check, don't apply changes
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs-check

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    # On PRs only check, don't apply changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: PHPStan (level and ignoreErrors from phpstan.neon.dist; fails the build on any error)
        run: composer phpstan --no-interaction

      - name: Igor worker-state audit (REQ-CS-008, FrankenPHP worker mode without kernel reset)
        run: composer igor --no-interaction

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, gd, sodium
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run tests with coverage
        run: |
          echo "🧪 Running tests with coverage..."
          composer test-coverage

          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Validate 100% coverage
        run: |
          echo "📊 Validating 100% coverage..."

          # Validate that coverage is 100%
          php -r "
          if (!file_exists('coverage.xml')) {
              echo 'ERROR: coverage.xml file was not generated\n';
              exit(1);
          }

          \$coverage = simplexml_load_file('coverage.xml');
          if (\$coverage === false) {
              echo 'ERROR: Could not read coverage.xml\n';
              exit(1);
          }

          \$metrics = \$coverage->project->metrics;
          \$elements = (float)\$metrics['elements'];
          \$coveredElements = (float)\$metrics['coveredelements'];

          if (\$elements == 0) {
              echo 'No elements to cover\n';
              exit(0);
          }

          \$percentage = (\$coveredElements / \$elements) * 100;

          echo \"Coverage: \$coveredElements/\$elements (\$percentage%)\n\";

          if (\$percentage < 100) {
              echo \"ERROR: Coverage must be 100%. Current: \$percentage%\n\";
              exit(1);
          }

          echo \"✅ 100% coverage confirmed\n\";
          "

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # Dependency floor: the code must work with the LOWEST nowo-tech/transaction-* versions composer.json allows (a host
  # can run `composer update nowo-tech/user-kit-bundle` without updating them), and the demo lock must install what the
  # bundle requires (the demo installs from its lock, so a requirement added later is never installed and Demo smoke
  # fails with "class not found"). Same job as BreadcrumbKit (txd-constraint-1118).
  deps-floor:
    name: Dependency floor (nowo-tech/transaction-* lowest, demo lock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, gd, sodium
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Downgrade nowo-tech/transaction-* to the lowest allowed versions
        run: |
          composer update 'nowo-tech/transaction-*' --prefer-lowest --prefer-dist --no-progress --no-interaction
          composer show 'nowo-tech/transaction-*'

      - name: PHPStan at the floor
        run: composer phpstan

      - name: Tests at the floor
        timeout-minutes: 20
        run: composer test

