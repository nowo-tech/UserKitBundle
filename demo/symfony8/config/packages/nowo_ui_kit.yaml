# REQ-DEMO-014: UiKit's default theme, unchanged (no theme tokens, no CSS framework, no CDN).
# UiKit page contract (REQ-UI-003): one host layout for every bundle page; the demo shell is templates/base.html.twig
# (it extends UiKit's demo platform shell), so "My sessions" and the session administration render inside it.
nowo_ui_kit:
    css_framework: custom
    base_stylesheet: true
    icon_set: none
    layouts:
        admin: 'base.html.twig'
        guest: 'base.html.twig'
