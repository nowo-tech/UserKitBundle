# REQ-DEMO-014: UiKit's default theme, unchanged, with UiKit's own semantic stylesheet only (no CSS framework, no CDN).
# UiKit page contract (REQ-UI-003): one host layout for every bundle page; the demo shell is templates/base.html.twig,
# so "My sessions" and the session administration render inside it.
nowo_ui_kit:
    css_framework: custom
    icon_set: none
    layouts:
        admin: 'base.html.twig'
